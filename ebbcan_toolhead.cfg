# Native Klipper eddy probe (BTT Eddy coil, LDC1612 on the EBB36 i2c3).
# Section name must stay "btt_eddy": Demon Klipper Essentials detects it by name.
# reg_drive_current, calibration data and tap_threshold are written to the
# SAVE_CONFIG block by LDC_CALIBRATE_DRIVE_CURRENT, PROBE_EDDY_CURRENT_CALIBRATE
# and PROBE_EDDY_CURRENT_TAP_CALIBRATE.
[probe_eddy_current btt_eddy]
sensor_type: ldc1612
i2c_mcu: EBBCan
i2c_bus: i2c3_PB3_PB4
i2c_speed: 400000       # Same as .102 (proven with native tap); eddy-ng on .101 used the default
x_offset: 0.0
y_offset: 25.0
descend_z: 0.5          # Stop height for default probing (was z_offset); Klipper docs recommend 0.5
#tap_z_offset: 0.0      # Nozzle height at tap contact; adjust after first-layer tuning if needed
